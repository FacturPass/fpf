name: ci-rust
on:
  push:
    branches: [main]
    paths: ['rust/**', 'examples/**', 'fpf-1.1.schema.json', 'test-vectors.json']
  pull_request:
    paths: ['rust/**', 'examples/**', 'fpf-1.1.schema.json', 'test-vectors.json']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml
