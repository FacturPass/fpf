name: ci-js
on:
  push:
    branches: [main]
    paths: ['js/**', 'examples/**', 'fpf-1.1.schema.json', 'test-vectors.json']
  pull_request:
    paths: ['js/**', 'examples/**', 'fpf-1.1.schema.json', 'test-vectors.json']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Verify test-vectors.json is up to date
        run: |
          node scripts/generate-test-vectors.mjs
          git diff --exit-code ../test-vectors.json
